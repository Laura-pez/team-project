
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scamazon Coupon Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Coupon Permission Testing</h1>

    <h2>Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>

    <p id="account"></p>

    <hr>

    <h2>Create Coupon</h2>

    <input id="code" placeholder="Coupon code">

    <select id="storefront">
        <option value="GameFlop">GameFlop</option>
        <option value="Stater Girls">Stater Girls</option>
        <option value="Riverside Auto Parts">
            Riverside Auto Parts
        </option>
    </select>

    <input
        id="discount"
        type="number"
        value="10"
        min="1"
        max="100"
    >

    <button onclick="createCoupon()">Create Coupon</button>

    <hr>

    <button onclick="viewCoupons()">View Coupons</button>

    <pre id="result"></pre>

    <script>

        // Personal Supabase test project.
        const SUPABASE_URL =
            'https://waqghcyevjoombnlhfcl.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable__YqBNricuJnlK_3LfARxyQ_twaEZsxA';

        const client = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const output = document.getElementById('result');


        // Login using a test account.
        async function login() {

            const email = document
                .getElementById('email')
                .value.trim();

            const password = document
                .getElementById('password')
                .value;

            const { data, error } =
                await client.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) {
                output.textContent = error.message;
                return;
            }

            // Retrieve the logged-in user's role.
            const { data: profile, error: profileError } =
                await client
                    .from('users')
                    .select('role, storefront, status')
                    .eq('id', data.user.id)
                    .single();

            if (profileError) {
                output.textContent =
                    profileError.message;
                return;
            }

            document.getElementById('account').textContent =
                `Role: ${profile.role} | Store: ${profile.storefront || 'All'}`;

            output.textContent = 'Login successful.';
        }


        // Logout.
        async function logout() {

            const { error } =
                await client.auth.signOut();

            if (error) {
                output.textContent = error.message;
                return;
            }

            document.getElementById('account').textContent =
                '';

            output.textContent = 'Logged out.';
        }


        // Attempt to create a coupon.
        async function createCoupon() {

            const code = document
                .getElementById('code')
                .value.trim().toUpperCase();

            const storefront = document
                .getElementById('storefront')
                .value;

            const discount = Number(
                document.getElementById('discount').value
            );

            // Validate the coupon.
            if (
                !/^[A-Z0-9_-]{3,32}$/.test(code) ||
                !Number.isFinite(discount) ||
                discount <= 0 ||
                discount > 100
            ) {
                output.textContent =
                    'Enter a valid code and percentage.';
                return;
            }

            // Insert the coupon into Supabase.
            const { data, error } =
                await client
                    .from('coupons')
                    .insert({
                        code,
                        storefront,
                        discount_type: 'percent',
                        discount_value: discount
                    })
                    .select();

            output.textContent = error
                ? `Error: ${error.message}`
                : JSON.stringify(data, null, 2);
        }


        // Display coupons accessible to this account.
        async function viewCoupons() {

            const { data, error } =
                await client
                    .from('coupons')
                    .select('*');

            output.textContent = error
                ? `Error: ${error.message}`
                : JSON.stringify(data, null, 2);
        }

    </script>

</body>
</html>
