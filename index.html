<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scamazon - Automate inventory deductions, generate packing slips, and manage storefronts efficiently with our panel.">
    <title>Scamazon</title>
    
    <!-- Preconnect to Google Fonts for performance optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-slate-900 selection:text-white">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <nav class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center" aria-label="Main Navigation">
            <a href="/" class="text-xl font-bold tracking-tight text-slate-900 hover:opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-slate-900 rounded-sm">
                Scamazon<span class="text-indigo-600">.</span>
            </a>
            <a href="login.html" class="inline-flex items-center justify-center px-5 py-2 text-sm font-medium text-white bg-slate-900 rounded-md hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all duration-200">
                Log In
            </a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col">
        
        <!-- Hero Section -->
        <section class="relative px-6 py-12 flex-grow flex flex-col items-center justify-center text-center overflow-hidden" aria-label="Hero">
            <!-- Subtle background gradient -->
            <div class="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-50/50 via-slate-50 to-slate-50"></div>
            
            <h1 class="max-w-4xl text-5xl md:text-6xl font-extrabold tracking-tight text-slate-900 mb-6 leading-tight">
                Warehouse <br class="hidden sm:block" /> 
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-indigo-600">Management</span>
            </h1>
            
            <p class="max-w-2xl text-lg text-slate-600 mb-10 leading-relaxed">
                Where you products will never reach it's destination. 
            </p>
            
            <a href="login.html" class="inline-flex items-center justify-center px-8 py-3.5 text-base font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 hover:-translate-y-0.5 shadow-lg shadow-slate-900/20 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all duration-200">
                Get Started
                <svg class="ml-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </a>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 bg-white py-8" aria-label="Site Footer">
        <div class="max-w-7xl mx-auto px-6 text-sm text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>&copy; 2026 Scamazon WMS. All rights reserved.</p>
            <div class="flex space-x-6">
                <a href="#" class="hover:text-slate-900 transition-colors focus:outline-none focus:underline">Privacy Policy</a>
                <a href="#" class="hover:text-slate-900 transition-colors focus:outline-none focus:underline">Terms of Service</a>
            </div>
        </div>
    </footer>

</body>
</html>
