<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WMS Platform</title>
    
    <!-- Preconnect to Google Fonts for performance optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-slate-900 selection:text-white">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <nav class="max-w-7xl mx-auto px-6 h-16 flex items-center" aria-label="Main Navigation">
            <a href="index.html" class="text-xl font-bold tracking-tight text-slate-900 hover:opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-slate-900 rounded-sm">
                Scamazon<span class="text-indigo-600">.</span>
            </a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="relative flex-grow flex items-center justify-center py-12 px-6 overflow-hidden">
        <!-- Subtle background gradient -->
        <div class="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-50/50 via-slate-50 to-slate-50"></div>

        <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-xl shadow-slate-900/5 w-full max-w-md">
            <div class="text-center mb-6">
                <h1 id="form-title" class="text-2xl font-bold tracking-tight text-slate-900">Sign In</h1>
                <p id="form-subtitle" class="text-sm text-slate-600 mt-1">Access your dashboard</p>
            </div>

            <!-- Alerts -->
            <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200"></div>
            <div id="success-msg" class="hidden mb-4 p-3 bg-emerald-50 text-emerald-700 text-sm rounded-lg border border-emerald-200"></div>

            <!-- Form -->
            <form id="auth-form" class="space-y-4">
                <div id="name-container" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                    <input id="name" type="text" class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-all placeholder:text-slate-400" placeholder="Jane Doe">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input id="email" type="email" required class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-all placeholder:text-slate-400" placeholder="you@example.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input id="password" type="password" required class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-all placeholder:text-slate-400" placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn" class="w-full inline-flex items-center justify-center py-2.5 px-4 text-sm font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 hover:-translate-y-0.5 shadow-md shadow-slate-900/10 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    Sign In
                </button>
            </form>

            <!-- Toggle -->
            <div class="mt-6 text-center text-sm text-slate-600">
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-btn" type="button" class="text-indigo-600 font-semibold hover:text-indigo-500 hover:underline ml-1 focus:outline-none focus:ring-2 focus:ring-indigo-600 rounded-sm">Sign Up</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 bg-white py-8" aria-label="Site Footer">
        <div class="max-w-7xl mx-auto px-6 text-sm text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>&copy; 2026 Scamazon WMS. All rights reserved.</p>
            <div class="flex space-x-6">
                <a href="#" class="hover:text-slate-900 transition-colors focus:outline-none focus:underline">Privacy Policy</a>
                <a href="#" class="hover:text-slate-900 transition-colors focus:outline-none focus:underline">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://wtcqblyyprofjocksdij.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NUGKinF4M3L0vShVUX2xzg_-UiMum75';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isSignUp = false;

        const authForm = document.getElementById('auth-form');
        const nameInput = document.getElementById('name');
        const nameContainer = document.getElementById('name-container');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleText = document.getElementById('toggle-text');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const errorDiv = document.getElementById('error-msg');
        const successDiv = document.getElementById('success-msg');

        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (isSignUp) {
                nameContainer.classList.remove('hidden');
                formTitle.textContent = 'Create Account';
                formSubtitle.textContent = 'Register a new customer account';
                submitBtn.textContent = 'Sign Up';
                toggleText.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Sign In';
            } else {
                nameContainer.classList.add('hidden');
                formTitle.textContent = 'Sign In';
                formSubtitle.textContent = 'Access your dashboard';
                submitBtn.textContent = 'Sign In';
                toggleText.textContent = "Don't have an account?";
                toggleBtn.textContent = 'Sign Up';
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                if (isSignUp) {
                    const name = nameInput.value.trim();
                    const { data, error } = await client.auth.signUp({
                        email,
                        password,
                        options: { data: { role: 'customer', name } }
                    });

                    if (error) throw error;

                    successDiv.textContent = 'Account created successfully. You can now sign in.';
                    successDiv.classList.remove('hidden');
                    toggleBtn.click();
                } else {
                    const { data, error } = await client.auth.signInWithPassword({ email, password });
                    if (error) throw error;

                    const { data: userRecord, error: userErr } = await client
                        .from('users')
                        .select('role')
                        .eq('email', email)
                        .single();

                    if (userErr || !userRecord) {
                        throw new Error('User record could not be retrieved.');
                    }

                    if (userRecord.role === 'storefront_owner') {
                        window.location.href = 'storefront.html';
                    } else {
                        window.location.href = `${userRecord.role}.html`;
                    }
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUp ? 'Sign Up' : 'Sign In';
            }
        });
    </script>
</body>
</html>
